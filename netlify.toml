[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Prevent /api/* requests on static Netlify hosting from returning index.html (200 OK)
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
